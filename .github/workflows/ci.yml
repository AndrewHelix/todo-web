name: WEB CI
on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  check:
    name: WEB CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        env:
          VITE_API_URL: http://localhost:3000
        run: npm run build

      - name: Build Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL=http://localhost:3000 \
            -t course-web:${{ github.sha }} \
            .
